name: Build & Publish APK

on:
  push:
  workflow_dispatch:
    inputs:
      rebuild_from_source:
        description: 'Build ulang APK dari source code'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read app version from Gradle
        id: app-version
        run: |
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/' | tr -d '[:space:]')
          VERSION_NAME="${VERSION_NAME:-1.4}"
          VERSION_CODE="${VERSION_CODE:-5}"
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Detected KASLITE POS ${TAG_NAME} (Kode ${VERSION_CODE})"

      - name: Check prebuilt APK in repository
        id: check-apk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild_from_source }}" = "false" ] && [ -f apk/kaslite-pos.apk ]; then
            echo "use_prebuilt=true" >> "$GITHUB_OUTPUT"
            cp apk/kaslite-pos.apk kaslite-pos.apk
          else
            echo "use_prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Licenses
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
              yes | "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0" >/dev/null 2>&1 || true
            fi
          fi

      - name: Prepare debug keystore
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        env:
          SECRET_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$SECRET_DEBUG_KEYSTORE_B64" | tr -d '\r\n' | base64 -d > debug.keystore
            echo "Menggunakan debug.keystore dari GitHub Secret DEBUG_KEYSTORE_BASE64."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Menggunakan debug.keystore dari file debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            cat << 'EOF' | tr -d '\r\n' | base64 -d > debug.keystore
          
          EOF
            echo "Menggunakan debug.keystore bawaan AI Studio."
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias name|SHA256"

      - name: Install Gradle 9.3.1
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Configure Supabase Secrets (.env)
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ ! -f .env ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            echo "Konfigurasi .env dipersiapkan dari GitHub Secrets."
          else
            echo "Menggunakan placeholder .env.example."
          fi

      - name: Build Debug APK
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-build.log; then
            echo "## Build Debug APK Gagal" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "^e: |FAILED|FAILURE:|What went wrong:|Execution failed|Caused by:|Exception" /tmp/gradle-build.log | tail -n 60 >> "$GITHUB_STEP_SUMMARY" || true
            echo "--- TAIL ---" >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 /tmp/gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk kaslite-pos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: kaslite-pos-apk
          path: kaslite-pos.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.app-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          TAG_NAME: ${{ steps.app-version.outputs.tag_name }}
        run: |
          RELEASE_TITLE="KASLITE POS ${TAG_NAME} (Kode ${VERSION_CODE})"
          RELEASE_NOTES="Pembaruan KASLITE POS Versi ${VERSION_NAME} (Kode ${VERSION_CODE}). Unduh file **kaslite-pos.apk** pada bagian **Assets** di bawah ini untuk menginstal atau menimpa versi sebelumnya tanpa menghapus data kasir."

          # Bersihkan & perbarui release alias 'latest-apk' bila sudah ada (tanpa asset lama gerai-una-pos-ai.apk)
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release delete-asset latest-apk gerai-una-pos-ai.apk -y || true
            gh release upload latest-apk kaslite-pos.apk --clobber
            gh release edit latest-apk \
              --title "KASLITE POS (Latest APK - ${TAG_NAME})" \
              --notes "$RELEASE_NOTES"
          fi

          # Publikasikan release versi resmi (mis. v1.4) dan tandai sebagai Latest
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete-asset "$TAG_NAME" gerai-una-pos-ai.apk -y || true
            gh release upload "$TAG_NAME" kaslite-pos.apk --clobber
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create "$TAG_NAME" kaslite-pos.apk \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
