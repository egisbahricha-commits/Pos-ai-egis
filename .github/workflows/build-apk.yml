name: Build & Publish APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK filename
        run: cp app/build/outputs/apk/debug/app-debug.apk gerai-una-pos-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gerai-una-pos-ai-apk
          path: gerai-una-pos-ai.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Gerai Una POS AI (Latest APK)
          body: |
            Unduh file **gerai-una-pos-ai.apk** pada bagian **Assets** di bawah ini untuk menginstal aplikasi di perangkat Android Anda.
          files: gerai-una-pos-ai.apk
          make_latest: true
          overwrite_files: true
