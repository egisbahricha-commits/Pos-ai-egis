name: Build & Publish APK

on:
  push:
  workflow_dispatch:
    inputs:
      rebuild_from_source:
        description: 'Build ulang APK dari source code'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check prebuilt APK in repository
        id: check-apk
        run: |
          if [ "${{ inputs.rebuild_from_source }}" != "true" ] && [ -f apk/gerai-una-pos-ai.apk ]; then
            echo "use_prebuilt=true" >> "$GITHUB_OUTPUT"
            cp apk/gerai-una-pos-ai.apk gerai-una-pos-ai.apk
          else
            echo "use_prebuilt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Licenses
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Gradle 9.3.1
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        if: steps.check-apk.outputs.use_prebuilt != 'true'
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --console=plain \
            --stacktrace \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-build.log; then
            echo "## Build Debug APK Gagal" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 /tmp/gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk gerai-una-pos-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: gerai-una-pos-ai-apk
          path: gerai-una-pos-ai.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk gerai-una-pos-ai.apk --clobber
            gh release edit latest-apk \
              --title "Gerai Una POS AI (Latest APK)" \
              --notes "Unduh file **gerai-una-pos-ai.apk** pada bagian **Assets** di bawah ini untuk menginstal aplikasi di perangkat Android Anda." \
              --latest
          else
            gh release create latest-apk gerai-una-pos-ai.apk \
              --target "${{ github.sha }}" \
              --title "Gerai Una POS AI (Latest APK)" \
              --notes "Unduh file **gerai-una-pos-ai.apk** pada bagian **Assets** di bawah ini untuk menginstal aplikasi di perangkat Android Anda." \
              --latest
          fi
